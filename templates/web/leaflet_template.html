<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>{{TITLE}}</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  body { margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
  #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
  .map-title {
    position: absolute; top: 10px; left: 50px; z-index: 1000;
    background: rgba(255,255,255,0.92); padding: 8px 16px;
    border-radius: 4px; font-size: 16px; font-weight: 600;
    box-shadow: 0 1px 5px rgba(0,0,0,0.2); color: #333;
  }
  .legend-control {
    background: rgba(255,255,255,0.95); padding: 10px 14px;
    border-radius: 4px; box-shadow: 0 1px 5px rgba(0,0,0,0.2);
    font-size: 12px; line-height: 1.6; max-height: 400px;
    overflow-y: auto; min-width: 160px;
  }
  .legend-control h4 { margin: 0 0 8px 0; font-size: 13px; color: #333; }
  .legend-layer-title {
    cursor: pointer; display: flex; align-items: center; gap: 6px;
    font-weight: 600; padding: 3px 0; color: #333;
  }
  .legend-layer-title.disabled { opacity: 0.4; text-decoration: line-through; }
  .legend-class-item {
    display: flex; align-items: center; gap: 6px;
    padding: 1px 0 1px 20px; font-size: 11px; color: #555;
  }
  .legend-swatch {
    width: 14px; height: 14px; border-radius: 2px;
    border: 1px solid rgba(0,0,0,0.2); flex-shrink: 0;
  }
  .legend-swatch-sm {
    width: 12px; height: 12px; border-radius: 2px;
    border: 1px solid rgba(0,0,0,0.15); flex-shrink: 0;
  }
  .info-footer {
    position: absolute; bottom: 5px; left: 50px; z-index: 1000;
    background: rgba(255,255,255,0.8); padding: 3px 8px;
    border-radius: 3px; font-size: 10px; color: #666;
  }
</style>
</head>
<body>

<div class="map-title">{{TITLE}}</div>
<div id="map"></div>
<div class="info-footer">Generated by BigQgisMCP | Data: IGN, OpenStreetMap</div>

<script>
(function() {
  var center = {{CENTER}};
  var zoom = {{ZOOM}};
  var layersData = {{LAYERS_JSON}};

  var map = L.map('map').setView(center, zoom);

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  var layerGroups = {};
  var bounds = L.latLngBounds();

  layersData.forEach(function(ld) {
    var geojsonLayer = L.geoJSON(ld.geojson, {
      style: function(feature) {
        var fc = (feature.properties && feature.properties._color) || ld.color;
        return {
          color: fc,
          weight: 1.5,
          opacity: 0.85,
          fillColor: fc,
          fillOpacity: 0.6
        };
      },
      pointToLayer: function(feature, latlng) {
        var fc = (feature.properties && feature.properties._color) || ld.color;
        return L.circleMarker(latlng, {
          radius: 6,
          fillColor: fc,
          color: '#333',
          weight: 1,
          fillOpacity: 0.7
        });
      },
      onEachFeature: function(feature, layer) {
        if (feature.properties) {
          var rows = Object.entries(feature.properties)
            .filter(function(e) { return e[0] !== '_color' && e[1] !== null && e[1] !== ''; })
            .slice(0, 15)
            .map(function(e) {
              return '<tr><td style="font-weight:600;padding:2px 8px 2px 0">' +
                     e[0] + '</td><td>' + e[1] + '</td></tr>';
            }).join('');
          if (rows) {
            layer.bindPopup(
              '<div style="max-height:250px;overflow-y:auto">' +
              '<b>' + ld.name + '</b>' +
              '<table style="font-size:11px;margin-top:4px">' + rows + '</table></div>',
              {maxWidth: 350}
            );
          }
        }
      }
    }).addTo(map);

    layerGroups[ld.name] = geojsonLayer;

    try {
      var layerBounds = geojsonLayer.getBounds();
      if (layerBounds.isValid()) bounds.extend(layerBounds);
    } catch(e) {}
  });

  // Fit to data bounds
  if (bounds.isValid()) {
    map.fitBounds(bounds, {padding: [30, 30]});
  }

  // Legend control with graduated/categorized support
  var legend = L.control({position: 'topright'});
  legend.onAdd = function() {
    var div = L.DomUtil.create('div', 'legend-control');
    div.innerHTML = '<h4>Couches</h4>';

    layersData.forEach(function(ld) {
      // Layer title row (clickable toggle)
      var titleRow = L.DomUtil.create('div', 'legend-layer-title', div);
      titleRow.innerHTML =
        '<span class="legend-swatch" style="background:' + ld.color + '"></span>' +
        '<span>' + ld.name + ' (' + ld.feature_count + ')</span>';
      titleRow.onclick = function() {
        var group = layerGroups[ld.name];
        if (map.hasLayer(group)) {
          map.removeLayer(group);
          titleRow.classList.add('disabled');
        } else {
          map.addLayer(group);
          titleRow.classList.remove('disabled');
        }
      };

      // Graduated/categorized legend classes
      if (ld.legend && ld.legend.length > 0) {
        ld.legend.forEach(function(cls) {
          var classRow = L.DomUtil.create('div', 'legend-class-item', div);
          classRow.innerHTML =
            '<span class="legend-swatch-sm" style="background:' + cls.color + '"></span>' +
            '<span>' + cls.label + '</span>';
        });
      }
    });

    L.DomEvent.disableClickPropagation(div);
    return div;
  };
  legend.addTo(map);
})();
</script>
</body>
</html>
