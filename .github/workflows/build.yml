# Build et publication de l'image QgisRemoteMCP.
#
# Jusqu'ici ce depot n'avait aucun CI : l'image etait construite et poussee
# a la main. Rien ne signalait donc qu'une correction mergee sur main
# n'atteignait pas la production. Cas vecu le 2026-08-22 : un correctif de
# datasources.json est reste sans effet, le service continuant a tourner sur
# l'image precedente.
#
# L'image est consommee par le chart Helm du projet qgis-sspcloud
# (workspace.image.repository), ou elle tourne comme pod qgis-workspace-*.
#
# Le build est long (Ubuntu + QGIS Desktop complet, ~30 min) : il ne se
# declenche donc que sur les fichiers reellement embarques dans l'image,
# pas sur une simple retouche de documentation.
name: Build & Push QgisRemoteMCP image

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'supervisord.conf'
      - 'main_mcp.py'
      - 'src/**'
      - 'skills/**'
      - 'recipes/**'
      - 'templates/**'
      - 'datasources.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/nic01asfr/qgisremotemcp

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      # Le runner ne demarre qu'avec ~14 Go libres, insuffisant pour une image
      # QGIS complete. free-disk-space en recupere 25-30 en supprimant les
      # toolchains inutilisees ici. tool-cache reste actif : le supprimer coute
      # plus de temps qu'il n'en fait gagner sur ce build.
      - name: Liberer de l'espace disque
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Authentification GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pas de cache-from volontairement : buildx pullerait l'image precedente
      # avant de construire la nouvelle, doublant l'empreinte disque pour un
      # gain nul sur une image qui change peu souvent.
      - name: Build et push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          # Le tag :main accompagne :latest. Sur certains noeuds SSPCloud, le
          # cache local de :latest ne se rafraichit pas malgre pullPolicy
          # Always ; :main change a chaque publication et force le re-pull.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}

      # Verification minimale : le catalogue de sources est le fichier le plus
      # souvent modifie et le seul qui casse silencieusement le service quand
      # il est invalide. On controle qu'il est present, lisible et coherent.
      - name: Controle du catalogue embarque
        run: |
          docker run --rm --entrypoint python3 "${IMAGE}:${{ github.sha }}" -c "
          import json
          d = json.load(open('/app/datasources.json'))
          src = [s for s in d['sources'] if 'id' in s]
          ids = [s['id'] for s in src]
          assert len(ids) == len(set(ids)), 'identifiants en double'
          for s in src:
              assert s.get('type'), f\"type manquant : {s['id']}\"
          print(f'catalogue OK : {len(src)} sources')
          "
