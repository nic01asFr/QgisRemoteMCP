name: Build & Push QgisRemoteMCP Image

# Build de l'image workspace QGIS Desktop (ubuntu 24.04 + QGIS LTR + noVNC +
# MCP server + bridge PyQGIS). Image lourde (~8-10 Go). Publiee sur
# ghcr.io/nic01asfr/qgisremotemcp:latest — consommee par le pod workspace
# de chaque user sur SSPCloud.
#
# Avant cette CI, l'image etait buildee manuellement. Desormais tout push
# sur main qui touche le code applicatif ou le Dockerfile declenche un
# rebuild + push automatique (comme qgis-agent / qgis-hub cote qgis-sspcloud).
# Apres le push de l'image, chaque pod workspace doit etre restart pour pull
# (imagePullPolicy: Always).
#
# Recette disque eprouvee (cf. build-geoai-gpu cote Passerelle) :
#   - jlumbroso/free-disk-space libere ~25-30 Go (runner n'a qu'une partition /)
#   - PAS de cache-from (pull ancienne image ~10 Go doublerait l'empreinte)
#   - set -eu sans pipefail (SIGPIPE de head -> exit 141 ferait tomber le job)
#
# PREREQUIS package GHCR : le package qgisremotemcp ayant ete cree
# manuellement (docker push via PAT), il faut autoriser ce repo en ecriture
# dans les settings du package (Manage Actions access -> Add repository
# BigQgisMCP -> Write), sinon le push echoue en "denied: permission_denied:
# write_package". Fait le 2026-05-26.

on:
  push:
    branches: [main]
    paths:
      - 'main_mcp.py'
      - 'src/**'
      - 'recipes/**'
      - 'skills/**'
      - 'templates/**'
      - 'datasources.json'
      - 'setup_qgis_connections.py'
      - 'entrypoint.sh'
      - 'maximize_qgis.sh'
      - 'supervisord.conf'
      - 'requirements.txt'
      - 'Dockerfile'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/nic01asfr/qgisremotemcp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free disk space on runner
        # Libere ~25-30 Go en supprimant SDK pre-installes. Le runner ubuntu
        # hosted n'a qu'une partition / (~75 Go total, ~14 Go libres init).
        # Apres cleanup : ~43 Go libres, assez pour build image ~10 Go sans
        # cache-from.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check disk state
        # set -eu sans pipefail : eviter le SIGPIPE de head sur docker info
        # qui propage en exit 141 et fait tomber le job entier.
        run: |
          set -eu
          df -h /
          docker info 2>&1 | grep -E "Storage Driver|Docker Root Dir|Total Memory" || true

      - uses: actions/checkout@v4

      - name: Login to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        # cache-from retire volontairement : pull l'ancienne image (~10 Go)
        # doublerait l'empreinte disque pendant le build.
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
