# ═══════════════════════════════════════════════════════════════════
# QgisRemoteMCP — Docker Compose
# ═══════════════════════════════════════════════════════════════════
#
# Usage:
#   docker compose up -d --build       # Build & start
#   docker compose logs -f bigqgismcp  # View logs
#   docker compose down                # Stop
#
# Endpoints (single-user mode, default):
#   MCP Server:  http://localhost:8100/mcp
#   QGIS noVNC:  http://localhost:6080
#   REST API:    http://localhost:8080
#   MJPEG:       http://localhost:8081/stream
#
# Multi-user mode — enable by setting MULTI_USER_MODE=true in .env:
#   1. Uncomment the Docker socket volume below.
#   2. Set JWT_SECRET, IDLE_TIMEOUT_MINUTES in .env.
#   3. Worker containers start automatically on first MCP call.
#      Their noVNC/API ports are dynamic (BASE_API_PORT+ etc.).

services:
  bigqgismcp:
    build: .
    container_name: bigqgismcp
    # GPU (optional) — Uncomment for CUDA/compute workloads.
    # QGIS rendering stays on CPU (Xvfb limitation — always uses Mesa/llvmpipe).
    # Requires NVIDIA Container Toolkit: https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    ports:
      - "${MCP_PORT:-8100}:8100"    # MCP Server
      - "${QGIS_VNC_PORT:-6080}:6080"  # noVNC (QGIS in browser)
      - "8080:8080"                  # REST API
      - "8081:8081"                  # MJPEG stream
    environment:
      # Uncomment with deploy block above for GPU support
      # - NVIDIA_VISIBLE_DEVICES=all
      # - NVIDIA_DRIVER_CAPABILITIES=graphics,compute,utility
      - QGIS_RESOLUTION=${QGIS_RESOLUTION:-1920x1080x24}
      - MCP_PORT=8100
      - VNC_HOST=${VNC_HOST:-localhost}
      - MOONDREAM_URL=${MOONDREAM_URL:-http://host.docker.internal:8001}
      - SAMGEO3_URL=${SAMGEO3_URL:-http://host.docker.internal:8002}
      - DEPTHPRO_URL=${DEPTHPRO_URL:-http://host.docker.internal:8003}
      - PYTHONUNBUFFERED=1
      # Project to open on startup (path inside container, e.g. /data/myproject.qgz)
      # If empty or not found, a new default project is created automatically
      - QGIS_PROJECT=${QGIS_PROJECT:-}
      # ── Multi-user mode (off by default) ─────────────────────────
      - MULTI_USER_MODE=${MULTI_USER_MODE:-false}
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-in-prod}
      # Required when MULTI_USER_MODE=true:
      - IDLE_TIMEOUT_MINUTES=${IDLE_TIMEOUT_MINUTES:-}
      # Optional tuning:
      - QGIS_IMAGE=${QGIS_IMAGE:-bigqgismcp:latest}
      - BASE_API_PORT=${BASE_API_PORT:-9000}
      - BASE_STREAM_PORT=${BASE_STREAM_PORT:-9100}
      - BASE_NOVNC_PORT=${BASE_NOVNC_PORT:-9200}
      - MAX_CONTAINERS=${MAX_CONTAINERS:-50}
      - DATA_DIR=${DATA_DIR:-/data}
    volumes:
      - ./data:/data
      # Dev: mount source for live editing (restart container to apply)
      - ./main_mcp.py:/app/main_mcp.py:ro
      - ./qgis_app.html:/app/qgis_app.html:ro
      - ./datasources.json:/app/datasources.json:ro
      - ./setup_qgis_connections.py:/app/setup_qgis_connections.py:ro
      - ./src:/app/src:ro
      - ./skills:/app/skills:ro
      - ./templates:/app/templates:ro
      - ./recipes:/app/recipes:ro
      # ── Multi-user: Docker socket (uncomment to enable) ───────────
      # Required for MULTI_USER_MODE=true — lets the gateway spawn user containers.
      # - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
